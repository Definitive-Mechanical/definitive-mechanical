[build]
  command = "pnpm run build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--version"

# Trailing-slash normalization — canonical form is no trailing slash.
# Matches the canonical tag emitted by CanonicalTag.tsx and the sitemap.
# Must come BEFORE the SPA fallback below so it wins for `/foo/` style URLs.
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301
  force = true

# SPA fallback — any route Netlify didn't prerender falls back to the
# root index.html so client-side wouter can handle it. Prerendered routes
# live at `/<route>/index.html` and are served directly by Netlify
# before this rule is evaluated.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
