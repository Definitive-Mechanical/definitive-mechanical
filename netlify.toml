[build]
  command = "pnpm run build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--version"

# SPA fallback — any route Netlify didn't prerender falls back to the
# root index.html so client-side wouter can handle it. Prerendered routes
# live at `/<route>/index.html` and are served directly by Netlify
# before this rule is evaluated.
#
# Note: trailing-slash normalization is handled via the <link rel="canonical">
# tag baked into every prerendered page (no-trailing-slash form, matching
# the sitemap). A `from = "/*/"` redirect rule caused an infinite redirect
# loop in production and has been removed.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
